        let intersectedMesh = null;

        window.addEventListener('mousemove', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            tooltip.style.left = event.clientX + 'px';
            tooltip.style.top = event.clientY + 'px';
        });
		
		window.addEventListener('click', () => {
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(pulsarMeshes);

            if (intersects.length > 0) {
                const clickedMesh = intersects[0].object;
                const pulsarName = clickedMesh.userData.name;
                
                // Option A: Open Google Search with the pulsar name in a new tab
                // const searchUrl = `https://www.google.com/search?q=pulsar+${encodeURIComponent(pulsarName)}`;
                
                // Option B: If you prefer DuckDuckGo, uncomment the line below instead:
                const searchUrl = `https://duckduckgo.com/?q=pulsar+${encodeURIComponent(pulsarName)}`;

                window.open(searchUrl, '_blank');

                // Visual feedback: briefly turn the pulsar bright green when clicked
                clickedMesh.material.color.set(0x00ff00);
                setTimeout(() => {
                    clickedMesh.material.color.set(0xff00ff);
                }, 300);
            }
        });

        function checkIntersections() {
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(pulsarMeshes);

            if (intersects.length > 0) {
                const hitMesh = intersects[0].object;
                if (intersectedMesh !== hitMesh) {
                    if (intersectedMesh) {
                        // Revert previous mesh based on what it was
                        if (intersectedMesh === sunMesh) {
                            intersectedMesh.material.color.set(0xffaa00);
                        } else if (intersectedMesh === sagAStarMesh) {
                            intersectedMesh.material.color.set(0xffffff);
                        } else {
                            intersectedMesh.material.color.set(0x00ffff); // Revert regular pulsar
                        }
                    }
                    intersectedMesh = hitMesh;
                    
                    // Highlight pink only if it's a regular pulsar
                    if (intersectedMesh !== sunMesh && intersectedMesh !== sagAStarMesh) {
                        intersectedMesh.material.color.set(0xff00ff); 
                    }

                    tooltip.innerText = intersectedMesh.userData.name;
                    tooltip.style.display = 'block';
                }
            } else {
                if (intersectedMesh) {
                    // Revert current mesh when moving off of it completely
                    if (intersectedMesh === sunMesh) {
                        intersectedMesh.material.color.set(0xffaa00);
                    } else if (intersectedMesh === sagAStarMesh) {
                        intersectedMesh.material.color.set(0xffffff);
                    } else {
                        intersectedMesh.material.color.set(0x00ffff);
                    }
                    intersectedMesh = null;
                }
                tooltip.style.display = 'none';
            }
        }
		
		function updateMovement() {
            const speed = 0.1;
            // Get camera's local directions to move relative to where you are looking
            const forward = new THREE.Vector3();
            camera.getWorldDirection(forward);
            const right = new THREE.Vector3();
            right.crossVectors(camera.up, forward).normalize();

            if (keys.W) {
                camera.position.addScaledVector(forward, speed);
                controls.target.addScaledVector(forward, speed);
            }
            if (keys.S) {
                camera.position.addScaledVector(forward, -speed);
                controls.target.addScaledVector(forward, -speed);
            }
            if (keys.A) {
                camera.position.addScaledVector(right, speed);
                controls.target.addScaledVector(right, speed);
            }
            if (keys.D) {
                camera.position.addScaledVector(right, -speed);
                controls.target.addScaledVector(right, -speed);
            }
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
			updateMovement();
            controls.update();
            checkIntersections();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
